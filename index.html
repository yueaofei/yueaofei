<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>岳奥飞 · 个人简历</title>
    <style>
        /* ===== CSS Variables & Reset ===== */
        :root {
            --color-primary: #2563eb;
            --color-primary-light: #3b82f6;
            --color-primary-dark: #1d4ed8;
            --color-secondary: #7c3aed;
            --color-accent: #06b6d4;
            --color-bg-start: #d4e9ff;
            --color-bg-end: #e6f3ff;
            --color-bg-card: rgba(255, 255, 255, 0.72);
            --color-text: #0f172a;
            --color-text-secondary: #1e293b;
            --color-text-muted: #334155;
            --color-border: rgba(148, 163, 184, 0.35);
            --shadow-sm: 0 2px 12px rgba(0, 50, 100, 0.06);
            --shadow-md: 0 8px 30px rgba(0, 50, 100, 0.10);
            --shadow-lg: 0 16px 48px rgba(0, 50, 100, 0.14);
            --radius: 12px;
            --radius-sm: 6px;
            --transition: 0.25s ease;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            --max-width: 1100px;
            --nav-height: 64px;
        }

        [data-theme="dark"] {
            --color-bg-start: #0b1a2e;
            --color-bg-end: #0f2238;
            --color-bg-card: #1e2a3a;
            --color-text: #f1f5f9;
            --color-text-secondary: #cbd5e1;
            --color-text-muted: #94a3b8;
            --color-border: #2a3a4e;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.5);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-sans);
            background:
                radial-gradient(circle at 10% 20%, rgba(180, 220, 255, 0.5) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(220, 200, 255, 0.3) 0%, transparent 50%),
                linear-gradient(145deg, var(--color-bg-start), var(--color-bg-end));
            background-attachment: fixed;
            color: var(--color-text);
            line-height: 1.6;
            padding-top: var(--nav-height);
            transition: background 0.5s, color 0.3s;
            min-height: 100vh;
        }

        [data-theme="dark"] body {
            background:
                radial-gradient(circle at 20% 30%, rgba(60, 100, 180, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 80% 70%, rgba(120, 80, 200, 0.12) 0%, transparent 60%),
                linear-gradient(145deg, var(--color-bg-start), var(--color-bg-end));
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.4;
            filter: blur(80px);
        }
        body::before {
            width: 500px;
            height: 500px;
            top: -100px;
            left: -100px;
            background: rgba(120, 180, 255, 0.25);
        }
        body::after {
            width: 600px;
            height: 600px;
            bottom: -150px;
            right: -150px;
            background: rgba(200, 170, 255, 0.2);
        }
        [data-theme="dark"] body::before {
            background: rgba(60, 120, 255, 0.15);
        }
        [data-theme="dark"] body::after {
            background: rgba(160, 100, 255, 0.12);
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 20px 60px;
        }

        /* ===== Navigation ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--nav-height);
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--color-border);
            display: flex;
            align-items: center;
            padding: 0 24px;
            z-index: 1000;
            transition: background 0.3s, border-color 0.3s;
        }
        [data-theme="dark"] .navbar {
            background: rgba(15, 23, 42, 0.75);
        }

        .navbar .nav-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: var(--max-width);
            margin: 0 auto;
        }

        .nav-brand {
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
            color: var(--color-primary);
            text-decoration: none;
        }
        .nav-brand span {
            color: var(--color-secondary);
        }

        .nav-links {
            display: flex;
            gap: 8px;
            list-style: none;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: var(--color-text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 20px;
            transition: background 0.2s, color 0.2s;
            font-weight: 500;
        }
        .nav-links a:hover {
            background: var(--color-primary);
            color: #fff;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .nav-actions button {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 6px;
            border-radius: 30px;
            color: var(--color-text-secondary);
            transition: background 0.2s, color 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
        }
        .nav-actions button:hover {
            background: var(--color-border);
            color: var(--color-text);
        }
        .nav-actions .print-btn {
            font-size: 0.9rem;
            width: auto;
            padding: 6px 14px;
            background: var(--color-primary);
            color: #fff;
            border-radius: 30px;
            font-weight: 500;
        }
        .nav-actions .print-btn:hover {
            background: var(--color-primary-dark);
        }
        .nav-actions .music-btn {
            font-size: 1.2rem;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(37, 99, 235, 0.08);
            transition: background 0.2s;
        }
        .nav-actions .music-btn:hover {
            background: rgba(37, 99, 235, 0.18);
        }
        .nav-actions .music-btn.playing {
            background: rgba(37, 99, 235, 0.2);
            box-shadow: 0 0 16px rgba(37, 99, 235, 0.15);
        }

        /* ===== Hero ===== */
        .hero {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 30px;
            padding: 40px 0 20px;
            border-bottom: 1px solid var(--color-border);
            margin-bottom: 32px;
        }
        .hero-avatar {
            flex-shrink: 0;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            font-weight: 700;
            color: #fff;
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }
        .hero-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .hero-content {
            flex: 1;
            min-width: 200px;
        }
        .hero-content h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }
        .hero-content .subtitle {
            font-size: 1rem;
            color: var(--color-text-secondary);
            margin-bottom: 12px;
        }
        .hero-content .summary {
            color: var(--color-text-secondary);
            max-width: 600px;
            margin-bottom: 16px;
            font-size: 0.95rem;
        }
        .hero-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }
        .hero-tags .tag {
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(4px);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--color-text-secondary);
            border: 1px solid var(--color-border);
        }
        [data-theme="dark"] .hero-tags .tag {
            background: var(--color-border);
            border-color: transparent;
        }
        .hero-tags .tag.highlight {
            background: var(--color-primary);
            color: #fff;
            border-color: var(--color-primary);
        }
        .hero-contact {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        .hero-contact a {
            color: var(--color-text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 30px;
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            transition: border 0.2s, background 0.2s;
            backdrop-filter: blur(4px);
        }
        .hero-contact a:hover {
            border-color: var(--color-primary);
            background: var(--color-primary-light);
            color: #fff;
        }
        .hero-contact .copy-btn {
            cursor: pointer;
            background: transparent;
            border: none;
            color: var(--color-text-muted);
            font-size: 0.8rem;
            margin-left: 4px;
        }

        /* ===== Highlights ===== */
        .highlights {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 40px;
        }
        .highlight-card {
            background: var(--color-bg-card);
            backdrop-filter: blur(8px);
            border-radius: var(--radius);
            padding: 20px 16px;
            text-align: center;
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow-sm);
            transition: transform var(--transition), box-shadow var(--transition);
        }
        .highlight-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }
        .highlight-card .number {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--color-primary);
            line-height: 1.2;
        }
        .highlight-card .label {
            font-size: 0.85rem;
            color: var(--color-text-secondary);
            margin-top: 4px;
        }

        /* ===== Section Titles ===== */
        .section-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin: 40px 0 20px;
            letter-spacing: -0.3px;
            position: relative;
            display: inline-block;
            color: var(--color-text);
        }
        .section-title::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -4px;
            width: 40px;
            height: 4px;
            background: linear-gradient(90deg, var(--color-primary), var(--color-secondary));
            border-radius: 4px;
        }

        /* ===== Tabs ===== */
        .tabs-container {
            margin-bottom: 24px;
        }
        .tabs-list {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            border-bottom: 2px solid var(--color-border);
            padding-bottom: 4px;
            margin-bottom: 20px;
        }
        .tabs-list button {
            background: transparent;
            border: none;
            padding: 8px 20px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--color-text-muted);
            border-radius: 30px 30px 0 0;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
            border-bottom: 3px solid transparent;
            font-family: inherit;
        }
        .tabs-list button:hover {
            color: var(--color-text);
            background: rgba(255,255,255,0.3);
        }
        .tabs-list button[aria-selected="true"] {
            color: var(--color-primary);
            border-bottom-color: var(--color-primary);
            background: transparent;
            font-weight: 600;
        }
        .tab-panel {
            display: none;
            animation: fadeIn 0.25s ease;
        }
        .tab-panel[aria-hidden="false"] {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== Experience Cards ===== */
        .exp-item {
            background: var(--color-bg-card);
            backdrop-filter: blur(8px);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 16px;
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow-sm);
            transition: box-shadow var(--transition);
        }
        .exp-item:hover {
            box-shadow: var(--shadow-md);
        }
        .exp-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }
        .exp-header .exp-title {
            font-size: 1.1rem;
            font-weight: 600;
        }
        .exp-header .exp-org {
            color: var(--color-text-secondary);
            font-weight: 500;
        }
        .exp-header .exp-period {
            font-size: 0.85rem;
            color: var(--color-text-muted);
            font-weight: 400;
        }
        .exp-details {
            list-style: none;
            padding-left: 0;
        }
        .exp-details li {
            position: relative;
            padding-left: 20px;
            margin-bottom: 6px;
            font-size: 0.92rem;
            color: var(--color-text-secondary);
        }
        .exp-details li::before {
            content: "▹";
            position: absolute;
            left: 0;
            color: var(--color-primary);
            font-weight: 700;
        }
        .exp-details li strong {
            color: var(--color-text);
            font-weight: 600;
        }

        /* ===== Project Cards ===== */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .project-card {
            background: var(--color-bg-card);
            backdrop-filter: blur(8px);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow-sm);
            transition: transform var(--transition), box-shadow var(--transition);
            display: flex;
            flex-direction: column;
        }
        .project-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }
        .project-card .project-name {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .project-card .project-period {
            font-size: 0.8rem;
            color: var(--color-text-muted);
            margin-bottom: 8px;
        }
        .project-card .project-desc {
            font-size: 0.9rem;
            color: var(--color-text-secondary);
            flex: 1;
            margin-bottom: 10px;
        }
        .project-card .project-stack {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
        }
        .project-card .project-stack span {
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(4px);
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--color-text-muted);
            border: 1px solid var(--color-border);
        }
        [data-theme="dark"] .project-card .project-stack span {
            background: var(--color-border);
        }
        .project-card .project-result {
            font-size: 0.9rem;
            color: var(--color-primary);
            font-weight: 500;
            border-top: 1px solid var(--color-border);
            padding-top: 10px;
            margin-top: 4px;
        }

        /* ===== Skills ===== */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin: 16px 0 8px;
        }
        .skill-group {
            background: var(--color-bg-card);
            backdrop-filter: blur(8px);
            border-radius: var(--radius);
            padding: 16px 18px;
            border: 1px solid var(--color-border);
        }
        .skill-group .skill-label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--color-text-secondary);
            margin-bottom: 8px;
            display: block;
        }
        .skill-group .skill-items {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .skill-group .skill-items span {
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(4px);
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--color-text-secondary);
            border: 1px solid var(--color-border);
        }
        [data-theme="dark"] .skill-group .skill-items span {
            background: var(--color-border);
        }
        .skill-group .skill-items span.proficient {
            background: var(--color-primary);
            color: #fff;
            border-color: var(--color-primary);
        }

        /* ===== Portfolio (作品集) ===== */
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin: 16px 0 8px;
        }
        .portfolio-item {
            position: relative;
            overflow: hidden;
            border-radius: var(--radius);
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: transform var(--transition), box-shadow var(--transition);
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }
        .portfolio-item:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }
        .portfolio-item img {
            width: 100%;
            height: auto;
            max-height: 300px;
            object-fit: contain;
            border-radius: var(--radius-sm);
        }
        .portfolio-item .portfolio-label {
            margin-top: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--color-text-secondary);
            text-align: center;
        }
        .portfolio-item .placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--color-text-muted);
            font-size: 0.9rem;
        }

        /* ===== Education & Cert ===== */
        .edu-cert-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 8px;
        }
        @media (max-width: 700px) {
            .edu-cert-grid {
                grid-template-columns: 1fr;
            }
        }
        .edu-card,
        .cert-card {
            background: var(--color-bg-card);
            backdrop-filter: blur(8px);
            border-radius: var(--radius);
            padding: 20px 24px;
            border: 1px solid var(--color-border);
        }
        .edu-card h3,
        .cert-card h3 {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .edu-card .meta,
        .cert-card .meta {
            color: var(--color-text-muted);
            font-size: 0.85rem;
            margin-bottom: 8px;
        }
        .edu-card .course-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }
        .edu-card .course-tags span {
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(4px);
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--color-text-muted);
            border: 1px solid var(--color-border);
        }
        [data-theme="dark"] .edu-card .course-tags span {
            background: var(--color-border);
        }
        .cert-card ul {
            list-style: none;
            padding-left: 0;
        }
        .cert-card ul li {
            padding: 4px 0;
            font-size: 0.92rem;
            color: var(--color-text-secondary);
            border-bottom: 1px solid var(--color-border);
        }
        .cert-card ul li:last-child {
            border-bottom: none;
        }
        .cert-card ul li::before {
            content: "🏅 ";
            font-size: 0.85rem;
        }

        /* ===== Lightbox ===== */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 30px;
        }
        .lightbox.active {
            opacity: 1;
            pointer-events: auto;
        }
        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            object-fit: contain;
        }
        .lightbox .close-btn {
            position: absolute;
            top: 30px;
            right: 40px;
            font-size: 2.5rem;
            color: #fff;
            cursor: pointer;
            background: none;
            border: none;
            transition: transform 0.2s;
        }
        .lightbox .close-btn:hover {
            transform: scale(1.2);
        }

        /* ===== Footer ===== */
        .footer {
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid var(--color-border);
            text-align: center;
            font-size: 0.8rem;
            color: var(--color-text-muted);
        }

        /* ===== Back to top ===== */
        .back-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--color-primary);
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            box-shadow: var(--shadow-md);
            transition: opacity 0.3s, transform 0.3s;
            opacity: 0;
            transform: scale(0.8);
            pointer-events: none;
            z-index: 999;
        }
        .back-top.visible {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }
        .back-top:hover {
            background: var(--color-primary-dark);
        }

        /* ===== Print Styles ===== */
        @media print {
            body {
                background: #fff !important;
                color: #000 !important;
                padding-top: 0 !important;
            }
            .navbar,
            .back-top,
            .nav-actions .print-btn,
            .nav-actions .theme-toggle,
            .nav-actions .music-btn,
            .lightbox {
                display: none !important;
            }
            .container {
                max-width: 100% !important;
                padding: 0 20px !important;
            }

        // ============================================================

        function $(sel, ctx) { return (ctx || document).querySelector(sel); }
        function $$(sel, ctx) { return Array.from((ctx || document).querySelectorAll(sel)); }
        function createElem(tag, cls, html) {
            const el = document.createElement(tag);
            if (cls) el.className = cls;
            if (html) el.innerHTML = html;
            return el;
        }

        function renderHighlights() {

        function renderTabs(containerId, items, groupKey, renderItemFn) {
            const container = document.getElementById(containerId);
            const list = container.querySelector('.tabs-list');
            const panels = container.querySelector('.tab-panels');
            list.innerHTML = '';
            panels.innerHTML = '';

            const cats = [...new Set(items.map(item => item[groupKey]))];
            if (cats.length === 0) return;

            cats.forEach((cat, idx) => {
                const btn = document.createElement('button');
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-selected', idx === 0 ? 'true' : 'false');
                btn.setAttribute('aria-controls', `panel-${containerId}-${idx}`);
                btn.id = `tab-${containerId}-${idx}`;
                btn.textContent = cat;
                btn.addEventListener('click', () => switchTab(containerId, idx));
                list.appendChild(btn);

                const panel = document.createElement('div');
                panel.setAttribute('role', 'tabpanel');
                panel.id = `panel-${containerId}-${idx}`;
                panel.setAttribute('aria-labelledby', `tab-${containerId}-${idx}`);
                panel.setAttribute('aria-hidden', idx === 0 ? 'false' : 'true');
                panel.className = 'tab-panel';
                items.filter(item => item[groupKey] === cat)
                    .forEach(item => panel.appendChild(renderItemFn(item)));
                panels.appendChild(panel);
            });

            list.addEventListener('keydown', (e) => {
                const tabs = $$('button', list);
                const current = tabs.findIndex(t => t.getAttribute('aria-selected') === 'true');
                let newIdx = current;
                if (e.key === 'ArrowRight') { e.preventDefault(); newIdx = (current + 1) % tabs.length; }
                if (e.key === 'ArrowLeft') { e.preventDefault(); newIdx = (current - 1 + tabs.length) % tabs.length; }
                if (newIdx !== current) {
                    switchTab(containerId, newIdx);
                    tabs[newIdx].focus();
                }
            });
        }

        function switchTab(containerId, idx) {
            const container = document.getElementById(containerId);
            const tabs = $$('button', container.querySelector('.tabs-list'));
            const panels = $$('.tab-panel', container.querySelector('.tab-panels'));
            tabs.forEach((t, i) => t.setAttribute('aria-selected', i === idx ? 'true' : 'false'));
            panels.forEach((p, i) => p.setAttribute('aria-hidden', i === idx ? 'false' : 'true'));
        }

        // ============================================================
        // MUSIC
        // ============================================================
        function initMusic() {
            const btn = document.getElementById('musicBtn');
            const audio = new Audio('https://cdn.pixabay.com/audio/2022/10/25/audio_ec6f6e8d8a.mp3');
            audio.loop = true;
            audio.volume = 0.3;
            audio.preload = 'auto';

            let isPlaying = false;
            let playedOnce = false;

            function autoPlay() {
                if (playedOnce) return;
                audio.play().then(() => {
                    isPlaying = true;
                    playedOnce = true;
                    btn.textContent = '🔊';
                    btn.classList.add('playing');
                }).catch(() => {});
                document.removeEventListener('click', autoPlay);
                document.removeEventListener('touchstart', autoPlay);
                document.removeEventListener('keydown', autoPlay);
            }

            document.addEventListener('click', autoPlay);
            document.addEventListener('touchstart', autoPlay);
            document.addEventListener('keydown', autoPlay);

            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (isPlaying) {
                    audio.pause();
                    isPlaying = false;
                    btn.textContent = '🎵';
                    btn.classList.remove('playing');
                } else {
                    if (!playedOnce) {
                        playedOnce = true;
                        audio.play().then(() => {
                            isPlaying = true;
                            btn.textContent = '🔊';
                            btn.classList.add('playing');
                        }).catch(() => {});
                        document.removeEventListener('click', autoPlay);
                        document.removeEventListener('touchstart', autoPlay);
                        document.removeEventListener('keydown', autoPlay);
                    } else {
                        audio.play().then(() => {
                            isPlaying = true;
                            btn.textContent = '🔊';
                            btn.classList.add('playing');
                        }).catch(() => {});
                    }
                }
            });

            document.addEventListener('visibilitychange', () => {
                if (document.hidden && isPlaying) {
                    audio.pause();
                } else if (!document.hidden && isPlaying) {
                    audio.play().catch(() => {});
                }
            });
        }

        // AVATAR — 证件照.jpg
        // ============================================================
        function initAvatar() {
            const container = document.getElementById('avatarContainer');
            const img = new Image();
            img.src = '证件照.jpg';
            img.onload = function() {
                container.innerHTML = '';
                const imgEl = document.createElement('img');
                imgEl.src = '证件照.jpg';
                imgEl.alt = '个人头像';
                container.appendChild(imgEl);
            };
            // 若图片不存在，保留默认文字头像
        }

        // ============================================================
        // INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            renderHighlights();
            renderExperience();
            renderProjects();
            renderSkills();
            renderPortfolio();
            renderEducation();
            renderCertificates();
            initLightbox();
            initTheme();
            initBackTop();
            initEmailCopy();
            initMusic();
            initAvatar();
        });
    </script>

</body>
